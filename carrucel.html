<div class="relative w-full max-w-4xl mx-auto overflow-hidden rounded-lg shadow-lg my-6 bg-white">
  <!-- Alto fijo responsivo para evitar saltos; puedes ajustarlo -->
  <div id="carousel" class="flex transition-transform duration-500 ease-out"
       style="height: 300px;">
    <img src="https://www.bmwmotos.com/static/bloques/listados_noticias/noticias/373.m.jpg?1726479973"
         class="w-full flex-shrink-0 object-cover" alt="BMW Moto">
    <img src="https://nikomotobike.com/840-large_default/motocicleta-ktm-125-duke-2024.jpg"
         class="w-full flex-shrink-0 object-cover" alt="KTM 125 Duke">
    <img src="https://cdn.pixabay.com/photo/2021/04/19/05/12/kawasaki-ninja-h2r-6190254_1280.jpg"
         class="w-full flex-shrink-0 object-cover" alt="Kawasaki H2R">
    <img src="https://i0.wp.com/www.asphaltandrubber.com/wp-content/uploads/2018/10/2019-Kawasaki-Z125-55-scaled.jpg?ssl=1"
         class="w-full flex-shrink-0 object-cover" alt="Kawasaki z125">
  </div>

  <!-- Controles -->
  <button id="prevBtn"
          class="absolute top-1/2 left-4 -translate-y-1/2 bg-black/60 hover:bg-black text-white px-3 py-1 rounded-full">
    ◀
  </button>
  <button id="nextBtn"
          class="absolute top-1/2 right-4 -translate-y-1/2 bg-black/60 hover:bg-black text-white px-3 py-1 rounded-full">
    ▶
  </button>

  <!-- Indicadores (opcional) -->
  <div id="dots" class="absolute bottom-3 left-1/2 -translate-x-1/2 flex gap-2"></div>
</div>
